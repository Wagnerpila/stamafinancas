# Evolution API local, gratuita, para testar o bot do WhatsApp.
#
#   docker compose -f docker-compose.evolution.yml up -d
#
# Depois, em server/.env:
#   WHATSAPP_PROVIDER=evolution
#   EVOLUTION_API_URL=http://localhost:8080
#   EVOLUTION_API_KEY=troque-esta-chave        (igual a AUTHENTICATION_API_KEY abaixo)
#   EVOLUTION_WEBHOOK_URL=http://host.docker.internal:3001/api/whatsapp/webhook
#   WHATSAPP_WEBHOOK_TOKEN=um-segredo-qualquer
# e conecte pelo Painel Admin > Bot do WhatsApp (a instância é criada sozinha).

services:
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_API_KEY: troque-esta-chave
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-postgres

  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

volumes:
  evolution_instances:
  evolution_pg:
